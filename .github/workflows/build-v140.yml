name: Build v140 canonical meter UI
on:
  push:
    branches: [v140-meter-canonical]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v140-meter-canonical
          fetch-depth: 0
      - name: Build and structurally test v140
        shell: pwsh
        run: ./build/v140/Build-v140.ps1
      - name: Validate runtime, grid save and manifest on Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($ps1 in @(Get-ChildItem -LiteralPath 'files/v140' -Filter *.ps1 -File)) {
            $tokens=$null
            $errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile($ps1.FullName,[ref]$tokens,[ref]$errors)
            if(@($errors).Count -gt 0) { throw ('PS5.1 parser error in '+$ps1.Name+': '+$errors[0].Message) }
          }
          $manifestText=[IO.File]::ReadAllText((Resolve-Path 'latest.json'))
          if($manifestText.Length -gt 0 -and [int][char]$manifestText[0] -eq 0xFEFF){throw 'latest.json must not contain BOM'}
          $manifest=$manifestText|ConvertFrom-Json
          if([string]$manifest.version -ne 'v140 RELEASE'){throw 'PS5.1 manifest version mismatch'}
          if(@($manifest.files).Count -lt 20){throw 'PS5.1 manifest file list incomplete'}
          Add-Type -AssemblyName System.Windows.Forms
          . .\files\v140\MeterDraftStore.ps1
          . .\files\v140\MeterGridBehavior.ps1
          $testRoot=Join-Path $env:RUNNER_TEMP 'domlight-v140-ps51-grid-test'
          if(Test-Path $testRoot){Remove-Item $testRoot -Recurse -Force}
          New-Item -ItemType Directory -Force -Path $testRoot|Out-Null
          $testFile=Join-Path $testRoot 'meter_drafts.json'
          $grid=New-Object System.Windows.Forms.DataGridView
          $grid.AllowUserToAddRows=$false
          $c1=New-Object System.Windows.Forms.DataGridViewCheckBoxColumn
          $c1.Name='Selected';[void]$grid.Columns.Add($c1)
          $c2=New-Object System.Windows.Forms.DataGridViewTextBoxColumn
          $c2.Name='NewValue';[void]$grid.Columns.Add($c2)
          $i=$grid.Rows.Add();$r=$grid.Rows[$i];$r.Tag='M001'
          $r.Cells['Selected'].Value=$true;$r.Cells['NewValue'].Value='123.45'
          $grid.CurrentCell=$r.Cells['Selected'];$grid.NotifyCurrentCellDirty($true)
          $drafts=@{}
          Save-MeterDraftsFromGrid -Grid $grid -Account 'ACC001' -Drafts $drafts -Path $testFile
          $loaded=Import-MeterDraftStore -Path $testFile
          if(-not [bool]$loaded['ACC001|M001'].Selected){throw 'PS5.1 checkbox persistence failed'}
          $meterText=Get-Content -LiteralPath '.\files\v140\MeterStatus.ps1' -Raw
          $a=$meterText.IndexOf('function Build-ObjectRows');$b=$meterText.IndexOf('$form=New-Object Windows.Forms.Form',$a)
          if($a -lt 0 -or $b -le $a){throw 'PS5.1 structural isolation failed'}
          if($meterText.Substring($a,$b-$a).Contains('$meterGrid')){throw 'PS5.1 regression: meterGrid in Build-ObjectRows'}
      - name: Commit generated v140
        shell: bash
        run: |
          git config user.name "Domlight Build"
          git config user.email "actions@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- files/v140 latest.json)" ]; then exit 0; fi
          git commit -m "Generate v140 canonical meter baseline"
          git push origin HEAD:v140-meter-canonical
