name: Verify v137 clean installer
on:
  push:
    branches: [v137-clean-installer]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v137-clean-installer
          fetch-depth: 0
      - name: Verify installer and runtime
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $tokens=$null;$errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'Install-Domlight-v137.ps1'),[ref]$tokens,[ref]$errors)
          if(@($errors).Count -gt 0){throw ('Installer parser error: '+$errors[0].Message)}

          $manifest=Get-Content -LiteralPath 'latest.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if([string]$manifest.version -ne 'v137 RELEASE'){throw 'latest.json is not v137 RELEASE'}
          foreach($file in @($manifest.files)){
            $repoPath=('files/v137/'+[string]$file.path).Replace('\','/')
            if(-not(Test-Path -LiteralPath $repoPath)){throw ('Manifest file missing: '+$repoPath)}
            $blob=(& git rev-parse ('HEAD:'+ $repoPath)).Trim()
            if($blob -ne ([string]$file.gitBlobSha).ToLowerInvariant()){throw ('Manifest checksum mismatch: '+$repoPath)}
          }

          & 'files/v137/SelfCheck.ps1' -Root 'files/v137'
          if($LASTEXITCODE -ne 0){throw 'v137 SelfCheck failed'}

          $installer=Get-Content -LiteralPath 'Install-Domlight-v137.ps1' -Raw -Encoding UTF8
          if($installer -notmatch 'Domlight_v137_CLEAN'){throw 'Installer target is not isolated clean folder'}
          if($installer -notmatch 'SourceDataRoot'){throw 'Installer has no explicit data migration source'}
          if($installer -match 'Remove-Item[^\r\n]+Domlight_v106_UPDATE_TEST'){throw 'Installer attempts to delete old test installation'}
