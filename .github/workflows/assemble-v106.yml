name: Assemble v106

on:
  push:
    paths:
      - 'staging/v106/READY'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble and verify payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v106
          cat staging/v106/chunk_*.b64 | tr -d '\n\r' | base64 -d > /tmp/v106/payload.zip
          echo 'c53d34833bf7509e863e21c8496dd77b540d9b31b45aaee26077b0256cd81bae  /tmp/v106/payload.zip' | sha256sum -c -
          rm -rf files/v106
          mkdir -p files/v106
          unzip -q /tmp/v106/payload.zip -d files/v106
          test "$(find files/v106 -maxdepth 1 -type f | wc -l)" -eq 13
      - name: Commit v106 files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf staging/v106
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add files/v106 staging/v106
          git commit -m 'Publish v106 release payload' || exit 0
          git push
