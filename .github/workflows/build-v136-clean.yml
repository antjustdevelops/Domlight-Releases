name: Build v136 clean baseline
on:
  push:
    branches: [v136-clean-baseline]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v136-clean-baseline
          fetch-depth: 0

      - name: Materialize and verify full v136
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $src='files/v135'; $dst='files/v136'
          if(Test-Path $dst){Remove-Item $dst -Recurse -Force}
          New-Item -ItemType Directory -Force -Path $dst|Out-Null
          Get-ChildItem $src -File | ForEach-Object { Copy-Item $_.FullName (Join-Path $dst $_.Name) -Force }
          Copy-Item 'files/v134/MENU_DOMLIGHT.ps1' (Join-Path $dst 'MENU_DOMLIGHT.ps1') -Force
          Copy-Item 'build/v136/SelfCheck.ps1' (Join-Path $dst 'SelfCheck.ps1') -Force
          Copy-Item 'build/v136/Install-Domlight.ps1' 'Install-Domlight-v136.ps1' -Force
          Copy-Item 'build/v136/INSTALL_DOMLIGHT_v136.cmd' 'INSTALL_DOMLIGHT_v136.cmd' -Force
          Set-Content -LiteralPath (Join-Path $dst 'VERSION.txt') -Value 'Domlight v136 RELEASE' -Encoding UTF8

          foreach($ps1 in @(Get-ChildItem -LiteralPath $dst -Filter *.ps1 -File)){
            $tokens=$null; $errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile($ps1.FullName,[ref]$tokens,[ref]$errors)
            if(@($errors).Count -gt 0){ throw ('Parser error in '+$ps1.Name+': '+$errors[0].Message) }
          }

          & (Join-Path $dst 'SelfCheck.ps1') -Root $dst
          if($LASTEXITCODE -ne 0){throw 'SelfCheck failed'}

      - name: Stage runtime and generate exact manifest
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git add files/v136
          $dst='files/v136'
          $managed=@(Get-ChildItem $dst -File | Select-Object -ExpandProperty Name | Sort-Object)
          $files=@()
          foreach($name in $managed){
            $repoPath=('files/v136/'+$name)
            $entry=(& git ls-files -s -- $repoPath)
            if([string]::IsNullOrWhiteSpace([string]$entry)){throw ('File is not staged: '+$repoPath)}
            $parts=([string]$entry -split '\s+')
            if($parts.Count -lt 3){throw ('Cannot read staged blob for: '+$repoPath)}
            $blob=$parts[1]
            $files += [ordered]@{path=$name;url="https://raw.githubusercontent.com/antjustdevelops/Domlight-Releases/main/files/v136/$name";gitBlobSha=$blob}
          }
          [ordered]@{
            version='v136 RELEASE'
            published='2026-08-29'
            notes='CLEAN FULL BASELINE: physical self-contained runtime in files/v136; verified PowerShell syntax and dependencies; checksums are generated from staged Git blobs; clean installer creates a new folder and migrates data without modifying the old installation; meter submission remains disabled.'
            files=$files
          } | ConvertTo-Json -Depth 6 | Set-Content 'latest.json' -Encoding UTF8

      - name: Commit generated clean baseline
        shell: bash
        run: |
          git config user.name "Domlight Build"
          git config user.email "actions@users.noreply.github.com"
          git add files/v136 latest.json Install-Domlight-v136.ps1 INSTALL_DOMLIGHT_v136.cmd
          if [ -z "$(git status --porcelain -- files/v136 latest.json Install-Domlight-v136.ps1 INSTALL_DOMLIGHT_v136.cmd)" ]; then exit 0; fi
          git commit -m "Generate v136 clean full baseline"
          git push origin HEAD:v136-clean-baseline
