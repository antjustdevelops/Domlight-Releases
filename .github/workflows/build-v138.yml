name: Build v138 persistent meter drafts
on:
  push:
    branches: [v138-meter-drafts]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v138-meter-drafts
          fetch-depth: 0
      - name: Build and verify v138
        shell: powershell
        run: ./build/v138/Build-v138.ps1
      - name: Commit generated v138
        shell: bash
        run: |
          git config user.name "Domlight Build"
          git config user.email "actions@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- files/v138 latest.json)" ]; then exit 0; fi
          git commit -m "Generate v138 persistent meter drafts baseline"
          git push origin HEAD:v138-meter-drafts
