name: Build v138 persistent meter drafts
on:
  push:
    branches: [v138-release-guard]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v138-release-guard
          fetch-depth: 0
      - name: Build and test v138
        shell: pwsh
        run: ./build/v138/Build-v138.ps1
      - name: Validate runtime and manifest on Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($ps1 in @(Get-ChildItem -LiteralPath 'files/v138' -Filter *.ps1 -File)) {
            $tokens=$null
            $errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile($ps1.FullName,[ref]$tokens,[ref]$errors)
            if(@($errors).Count -gt 0) { throw ('PS5.1 parser error in '+$ps1.Name+': '+$errors[0].Message) }
          }
          . .\files\v138\MeterDraftStore.ps1
          $testRoot=Join-Path $env:RUNNER_TEMP 'domlight-v138-ps51-test'
          if(Test-Path $testRoot){Remove-Item $testRoot -Recurse -Force}
          New-Item -ItemType Directory -Force -Path $testRoot|Out-Null
          $testFile=Join-Path $testRoot 'meter_drafts.json'
          $drafts=@{}
          $drafts['ACC001|M001']=[pscustomobject]@{Selected=$true;Value='123.45'}
          Export-MeterDraftStore -Drafts $drafts -Path $testFile
          $loaded=Import-MeterDraftStore -Path $testFile
          if(-not $loaded.ContainsKey('ACC001|M001')){throw 'PS5.1 draft reload failed'}
          if([string]$loaded['ACC001|M001'].Value -ne '123.45'){throw 'PS5.1 draft value mismatch'}

          $manifestPath=(Resolve-Path '.\latest.json').Path
          $bytes=[IO.File]::ReadAllBytes($manifestPath)
          if($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF){throw 'latest.json contains UTF-8 BOM'}
          $manifest=Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if([string]::IsNullOrWhiteSpace([string]$manifest.version)){throw 'Manifest version missing under PS5.1'}
          if(@($manifest.files).Count -eq 0){throw 'Manifest files missing under PS5.1'}
          if([string]$manifest.version -ne 'v138 RELEASE'){throw 'Unexpected manifest version'}
      - name: Commit generated v138
        shell: bash
        run: |
          git config user.name "Domlight Build"
          git config user.email "actions@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- files/v138 latest.json)" ]; then exit 0; fi
          git commit -m "Generate guarded v138 persistent meter drafts baseline"
          git push origin HEAD:v138-release-guard
