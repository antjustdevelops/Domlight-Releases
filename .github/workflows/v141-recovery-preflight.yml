name: v141-recovery-preflight
on:
  push:
    branches: [v141-recovery-candidate]
  workflow_dispatch:
jobs:
  powershell51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse recovery installer with Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens=$null;$errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'recovery/v141/INSTALL_V141_RECOVERY_V2.ps1'),[ref]$tokens,[ref]$errors)
          if(@($errors).Count){$errors|Format-List *;throw 'Parser failed'}
          Write-Host 'PARSE OK'
      - name: Validate recovery contracts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $ps=Get-Content 'recovery/v141/INSTALL_V141_RECOVERY_V2.ps1' -Raw
          $cmd=Get-Content 'recovery/v141/RUN_V141_RECOVERY.cmd' -Raw
          foreach($required in @('recovery_safety','update_backups','Domlight v141 RECOVERY CANDIDATE','Mailing.ps1','ConnectionSettings.ps1','GmailApi.ps1','Recipients.ps1','SelfCheck.ps1')){if($ps -notmatch [regex]::Escape($required)){throw "Missing contract: $required"}}
          if($ps -match "files/v135/(Mailing|ConnectionSettings|PdfEngine)"){throw 'Forbidden v135 replacement referenced'}
          $meter=Get-Content 'files/v140/MeterStatus.ps1' -Raw
          if($meter -match "Invoke-WebRequest[^\r\n]*?/meter/value" -or $meter -match "Invoke-RestMethod[^\r\n]*?/meter/value"){throw 'Meter submission call enabled'}
          if($cmd -notmatch 'pause' -or $cmd -notmatch 'INSTALL_V141_RECOVERY_V2.ps1'){throw 'Launcher contract failed'}
          Write-Host 'CONTRACT CHECK OK'
      - name: Verify pinned Git objects
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $pins=@(
            @('files/v106/AccountState.ps1','0521a6bf852a201df5cf0986650939a52fa34c61'),
            @('files/v109/AccountStatus.ps1','7013dfd669d61603dc161d15692855bd36060422'),
            @('files/v109/OrganizeDownloadedAccount.ps1','21b465f17fc0632890195d43b2b0081ad65f81be'),
            @('files/v106/Domlight.ps1','8745cf88f53f0745b388e8f13783fb771c99c642'),
            @('files/v106/AutoCheck.ps1','3d059b62d4df75d4ca00a634309dfe4c1ac28ade'),
            @('files/v140/RunAutoCheckHidden.ps1','69178900f9708cbbbcf26b8687b9c4bd6cab4c48'),
            @('files/v140/MeterStatus.ps1','063611850a8b6ba1a96bab3e7cd792179d73b6e1'),
            @('files/v140/MeterDraftStore.ps1','422bd3c38bfc0479d768229267337a5ff08548e5'),
            @('files/v140/MeterGridBehavior.ps1','5ef036f27f8a5fb8a040c758ee36a410516edc99')
          )
          foreach($p in $pins){$got=(git rev-parse "HEAD:$($p[0])").Trim();if($got-ne$p[1]){throw "Pin mismatch $($p[0]): $got"};Write-Host "PIN OK $($p[0])"}
      - name: Full recovery dry-run in isolated fixture
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'DomlightFixture';$data=Join-Path $root 'data';$backup=Join-Path $data 'update_backups\20260828_120000'
          New-Item -ItemType Directory -Force -Path $root,$data,$backup|Out-Null
          'old version'|Set-Content (Join-Path $root 'VERSION.txt') -Encoding UTF8
          'old updater'|Set-Content (Join-Path $root 'UpdateFromGitHub.ps1') -Encoding UTF8
          'old selfcheck'|Set-Content (Join-Path $root 'SelfCheck.ps1') -Encoding UTF8
          "$x='Gmail';$y='WhatsApp';$z='Recipients';$a='recipients.json';$b='email_history.json';$c='whatsapp_history.json';$d='gmail_token.dat'"|Set-Content (Join-Path $backup 'Mailing.ps1') -Encoding UTF8
          "$cfg=[pscustomobject]@{useProxy=$false;proxyUrl='';proxyUser='';proxyPassword=''}"|Set-Content (Join-Path $backup 'ConnectionSettings.ps1') -Encoding UTF8
          'function Send-GmailMessage { param() }'|Set-Content (Join-Path $root 'GmailApi.ps1') -Encoding UTF8
          'function Get-Recipients { param() }'|Set-Content (Join-Path $root 'Recipients.ps1') -Encoding UTF8
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File 'recovery/v141/INSTALL_V141_RECOVERY_V2.ps1' -Root $root -Silent
          if($LASTEXITCODE-ne0){throw "Recovery dry-run failed: $LASTEXITCODE"}
          $v=(Get-Content (Join-Path $root 'VERSION.txt') -Raw).Trim();if($v-ne'Domlight v141 RECOVERY CANDIDATE'){throw "Wrong version: $v"}
          if(-not(Test-Path (Join-Path $root 'data\recovery_safety'))){throw 'Safety backup missing'}
          $logs=@(Get-ChildItem $data -Filter 'recovery_v141_*.log');if($logs.Count-lt1 -or (Get-Content $logs[-1].FullName -Raw)-notmatch'SUCCESS'){throw 'SUCCESS log missing'}
          Write-Host 'FULL RECOVERY DRY-RUN OK'
      - name: Failure path leaves installation unchanged
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'DomlightFailureFixture';$data=Join-Path $root 'data';New-Item -ItemType Directory -Force -Path $root,$data|Out-Null
          'Domlight ORIGINAL'|Set-Content (Join-Path $root 'VERSION.txt') -Encoding UTF8
          $before=(Get-FileHash (Join-Path $root 'VERSION.txt') -Algorithm SHA256).Hash
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File 'recovery/v141/INSTALL_V141_RECOVERY_V2.ps1' -Root $root -Silent
          if($LASTEXITCODE-eq0){throw 'Expected failure did not occur'}
          $after=(Get-FileHash (Join-Path $root 'VERSION.txt') -Algorithm SHA256).Hash;if($before-ne$after){throw 'Failure modified existing installation'}
          Write-Host 'FAILURE/NO-CHANGE TEST OK'
