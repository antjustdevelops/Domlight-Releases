name: build-v137

on:
  push:
    branches: [v137-structural-audit]

permissions:
  contents: write

jobs:
  build-and-validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build full v137 snapshot
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $manifest=Get-Content latest.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $out=Join-Path $PWD 'files\v137'
          if(Test-Path -LiteralPath $out){Remove-Item -LiteralPath $out -Recurse -Force}
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          foreach($f in @($manifest.files)){
            $needle='/antjustdevelops/Domlight-Releases/main/'
            $idx=([string]$f.url).IndexOf($needle)
            if($idx -lt 0){throw "Unsupported manifest URL: $($f.url)"}
            $repoPath=([string]$f.url).Substring($idx+$needle.Length).Replace('/','\')
            if(-not(Test-Path -LiteralPath $repoPath)){throw "Manifest source missing: $repoPath"}
            Copy-Item -LiteralPath $repoPath -Destination (Join-Path $out ([string]$f.path)) -Force
          }

          foreach($name in @('Mailing.ps1','ConnectionSettings.ps1','SingleWindowLauncher.ps1','SelfCheck.ps1','PROJECT_STRUCTURE.md')){
            Copy-Item -LiteralPath (Join-Path 'build\v137' $name) -Destination (Join-Path $out $name) -Force
          }

          $domPath=Join-Path $out 'Domlight.ps1'
          $dom=[IO.File]::ReadAllText($domPath,[Text.Encoding]::UTF8)
          $dom=$dom.TrimStart([char]0xFEFF,"`r","`n")
          if($dom -notmatch '^param\(\[switch\]\$SmokeTest\)'){$dom="param([switch]`$SmokeTest)`r`n`r`n"+$dom}
          $startupPattern='(?s)\r?\ntry \{\r?\n    Add-Type -AssemblyName System\.Web.*?\r?\nRefresh-LastCheck\r?\n\[void\]\$form\.ShowDialog\(\)\s*$'
          $startupLines=@(
            '',
            'if ($SmokeTest) {',
            "    Write-Output 'SMOKE_OK Domlight'",
            '    $form.Dispose()',
            '    exit 0',
            '}',
            '',
            '# Startup intentionally avoids a portal request before the window is visible.',
            '# A saved session enables manual sync; portal validity is checked when an action uses it.',
            'try {',
            '    Add-Type -AssemblyName System.Web',
            '    Load-Session',
            '    if (Test-Path -LiteralPath $SessionFile) {',
            '        $lblStatus.Text = "Сессия сохранена"',
            '        $lblStatus.ForeColor = [Drawing.Color]::DarkOrange',
            '        $btnSync.Enabled = $true',
            '        Log "Сохранённая сессия загружена. Проверка соединения будет выполнена при обращении к порталу."',
            '    } else {',
            '        Log "Введите телефон и получите SMS."',
            '    }',
            '} catch {',
            '    Log "Старт: $($_.Exception.Message)"',
            '}',
            '',
            'Refresh-LastCheck',
            '[void]$form.ShowDialog()'
          )
          $startupReplacement=$startupLines -join "`r`n"
          $rx=New-Object Text.RegularExpressions.Regex($startupPattern,[Text.RegularExpressions.RegexOptions]::None)
          if(-not $rx.IsMatch($dom)){throw 'Domlight startup block was not found; refusing an unsafe build.'}
          $dom=$rx.Replace($dom,[Text.RegularExpressions.MatchEvaluator]{param($m)$startupReplacement},1)
          [IO.File]::WriteAllText($domPath,$dom,(New-Object Text.UTF8Encoding($true)))

          Set-Content -LiteralPath (Join-Path $out 'VERSION.txt') -Value 'Domlight v137 RELEASE' -Encoding UTF8

          $bom=New-Object Text.UTF8Encoding($true)
          foreach($p in @(Get-ChildItem -LiteralPath $out -Filter *.ps1 -File)){
            $text=[IO.File]::ReadAllText($p.FullName,[Text.Encoding]::UTF8)
            $text=$text.TrimStart([char]0xFEFF)
            [IO.File]::WriteAllText($p.FullName,$text,$bom)
          }

          Write-Host 'Built files/v137:'
          Get-ChildItem -LiteralPath $out -File | Sort-Object Name | Format-Table Name,Length

      - name: Parse and run SelfCheck on Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $PWD 'files\v137'
          foreach($f in @(Get-ChildItem -LiteralPath $root -Filter *.ps1 -File)){
            $tokens=$null;$errs=$null
            [void][Management.Automation.Language.Parser]::ParseFile($f.FullName,[ref]$tokens,[ref]$errs)
            if(@($errs).Count -gt 0){
              foreach($e in @($errs)){Write-Host "PARSER $($f.Name) line $($e.Extent.StartLineNumber): $($e.Message)"}
              throw "Parser failed: $($f.Name)"
            }
          }
          & (Join-Path $root 'SelfCheck.ps1') -Root $root
          if($LASTEXITCODE -ne 0){throw 'SelfCheck failed.'}

      - name: UI construction smoke tests
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $source=Join-Path $PWD 'files\v137'
          $smoke=Join-Path $env:RUNNER_TEMP 'domlight-v137-smoke'
          if(Test-Path $smoke){Remove-Item $smoke -Recurse -Force}
          Copy-Item $source $smoke -Recurse -Force
          foreach($name in @('ConnectionSettings.ps1','Mailing.ps1','Domlight.ps1')){
            $p=Start-Process powershell.exe -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-STA','-File',(Join-Path $smoke $name),'-SmokeTest') -PassThru -Wait -WindowStyle Hidden
            if($p.ExitCode -ne 0){throw "Smoke test failed: $name exit $($p.ExitCode)"}
            Write-Host "SMOKE PASS: $name"
          }

      - name: Generate checksummed v137 manifest
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $PWD 'files\v137'
          function Get-GitBlobSha([string]$Path){
            $bytes=[IO.File]::ReadAllBytes($Path)
            $header=[Text.Encoding]::ASCII.GetBytes(('blob '+$bytes.Length+[char]0))
            $combined=New-Object byte[] ($header.Length+$bytes.Length)
            [Buffer]::BlockCopy($header,0,$combined,0,$header.Length)
            [Buffer]::BlockCopy($bytes,0,$combined,$header.Length,$bytes.Length)
            $sha=[Security.Cryptography.SHA1]::Create()
            try{return (($sha.ComputeHash($combined)|ForEach-Object{$_.ToString('x2')}) -join '')}finally{$sha.Dispose()}
          }
          $files=@()
          foreach($f in @(Get-ChildItem -LiteralPath $root -File | Sort-Object Name)){
            $files += [ordered]@{
              path=$f.Name
              url=('https://raw.githubusercontent.com/antjustdevelops/Domlight-Releases/main/files/v137/'+$f.Name)
              gitBlobSha=(Get-GitBlobSha $f.FullName)
            }
          }
          $m=[ordered]@{
            version='v137 RELEASE'
            published='2026-08-29'
            notes='Full structural baseline: Windows PowerShell 5.1-safe UTF-8 BOM for every script; complete managed snapshot; visible child-window startup errors; cabinet opens before portal access; mailing grid uses explicit rows; data untouched; meter submission remains disabled.'
            files=$files
          }
          $json=$m|ConvertTo-Json -Depth 6
          [IO.File]::WriteAllText((Join-Path $PWD 'build\v137\latest.v137.json'),$json,(New-Object Text.UTF8Encoding($false)))
          Write-Host "Manifest files: $($files.Count)"

      - name: Verify candidate manifest against snapshot
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $m=Get-Content build\v137\latest.v137.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $root=Join-Path $PWD 'files\v137'
          if(@($m.files).Count -ne @(Get-ChildItem $root -File).Count){throw 'Manifest/file count mismatch.'}
          foreach($f in @($m.files)){if(-not(Test-Path -LiteralPath (Join-Path $root $f.path))){throw "Manifest target missing: $($f.path)"}}
          Write-Host 'Candidate manifest covers the full snapshot.'

      - name: Commit generated candidate
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add files/v137 build/v137/latest.v137.json
          git diff --cached --quiet
          if($LASTEXITCODE -eq 0){Write-Host 'Candidate already up to date.';exit 0}
          git commit -m 'Build v137 full baseline candidate'
          git push origin HEAD:v137-structural-audit
