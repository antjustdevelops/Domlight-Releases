name: Build v137

on:
  workflow_dispatch:
  push:
    branches:
      - v137-structural-audit
    paths:
      - build/v137/**
      - .github/workflows/build-v137.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and validate candidate
        shell: powershell
        run: |
          & .\build\v137\BuildV137.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit verified candidate
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add files/v137 build/v137/latest.v137.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "No generated changes."; exit 0 }
          git commit -m "Build verified v137 candidate"
          git fetch origin v137-structural-audit
          git rebase origin/v137-structural-audit
          git push origin HEAD:v137-structural-audit
